name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: humble-dl-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: humble-dl-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: humble-dl-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: humble-dl-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile binary
        run: deno compile -A --target ${{ matrix.target }} -o ${{ matrix.asset }} index.ts
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
